<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        div:hover {
            color: red;

        }
        
        div > p { /*mexe dentro do paragrafo dá div*/
            display: none;
            background-color: red;
            color: white;
            width: 300px;


        }
        div:hover > p {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse sobré o texto abaixo.</p>
    <div>
        passe o mose aqui
        <p>Texto Escondido</p>
    </div>
    <p>Fim do Exemplo</p>
    
</body>
</html>
